name: CI

# 1인 개발 + 여러 세션이 각자 브랜치에서 main 에 직접 병합하는 워크플로(PR 없음, CLAUDE.md
# 참고)라, push 시점에 바로 돈다 — 병합 전 로컬에서 놓친 회귀를 병렬 세션들 사이에서도
# 조기에 잡기 위함이다(진단 리포트 "권장 순서" 2단계).
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend tests (Gradle + H2/Flyway)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Run tests
        run: ./gradlew test --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test

  frontend-typecheck:
    name: Frontend typecheck (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  # tsc 는 네이티브 파일(.ts) 기준으로 해석하므로 "웹 번들에서만 터지는 import" 를 못 잡는다.
  # 실제로 f221b13(9/7) 이후 웹이 부팅 직후 흰 화면이었는데 일주일 동안 CI 가 초록이었다
  # (a29459f 에서 수정, docs/PC_APP_ANALYSIS_2026-09-14.md 0절). 번들을 만들어 보는 것만으로
  # 네이티브 모듈 import 해석 실패는 잡힌다 — 런타임 크래시까지는 못 잡는다.
  frontend-web-build:
    name: Frontend web bundle (expo export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Export web bundle
        run: npm run build:web
      - name: Report bundle size
        run: du -sh dist && du -sh dist/_expo/static/js/web 2>/dev/null || true
