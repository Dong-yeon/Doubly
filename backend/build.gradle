plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fitto'
version = '0.0.1-SNAPSHOT'
description = 'Doubly - 커플 라이프 공유 앱 백엔드'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
}

dependencies {
    // Web / REST API (설계서 4)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 영속 계층 — PostgreSQL + JPA (설계서 5)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 캐시/세션/초대코드 — Redis (설계서 6.1)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 실시간 채팅 — WebSocket(STOMP) (설계서 4.5 / 6.1)
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // 인증 — Spring Security + JWT (설계서 3.1 / 4.1)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // 메일 발송 — 비밀번호 재설정 인증코드 (AUTH-07)
    // spring.mail.host 가 없으면 JavaMailSender 빈이 만들어지지 않고 개발용 로그 발송으로 폴백된다.
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // DB 마이그레이션 — Flyway (DB 구성)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // DB 드라이버
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    // `-Dspring.*` 를 테스트 JVM 으로 넘긴다 — 데이터소스를 갈아끼워 돌리기 위한 통로다.
    // 기본은 H2 지만 운영은 PostgreSQL 이고, 둘은 SQL 해석이 달라
    // H2 에서 통과한 쿼리가 운영에서만 500 을 내는 일이 실제로 있었다(피드 타임라인).
    // 실행법은 docs/RUNNING.md 참고.
    systemProperties System.getProperties().findAll { k, v -> k.toString().startsWith('spring.') }
}

// Spring Boot 실행형 jar 만 생성 (plain jar 비활성화 → 산출물 단일화)
tasks.named('jar') {
    enabled = false
}
