plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fitto'
version = '0.0.1-SNAPSHOT'
description = 'Doubly - 커플 라이프 공유 앱 백엔드'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
}

dependencies {
    // Web / REST API (설계서 4)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 영속 계층 — PostgreSQL + JPA (설계서 5)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 캐시/세션/초대코드 — Redis (설계서 6.1)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 실시간 채팅 — WebSocket(STOMP) (설계서 4.5 / 6.1)
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // 인증 — Spring Security + JWT (설계서 3.1 / 4.1)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // 메일 발송 — 비밀번호 재설정 인증코드 (AUTH-07)
    // spring.mail.host 가 없으면 JavaMailSender 빈이 만들어지지 않고 개발용 로그 발송으로 폴백된다.
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    /*
     * 운영 관측 — Actuator + Micrometer.
     *
     * 이걸 안 붙여둔 대가를 한 번 치렀다: "AI가 끊긴다"를 코드만 읽고 분석하느라 원인 순위를
     * 틀렸고(실제 주범은 Gemini 503 이었는데 우리 쿼터를 지목했다), 커넥션 풀이 말라도
     * 헬스체크가 초록이라 아무 신호가 없었다. Hikari 사용량·Gemini 지연/실패율은
     * 추측할 것이 아니라 볼 수 있어야 한다. (docs/STABILITY_ANALYSIS_2026-09-01.md 참고)
     */
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // DB 마이그레이션 — Flyway (DB 구성)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // DB 드라이버
    runtimeOnly 'org.postgresql:postgresql'

    // Google Play 구독 웹훅(RTDN) 검증 — 알림 자체엔 상태가 없어서, Play Developer API로
    // 진짜 구독 상태(활성/만료/환불)를 다시 조회해야 한다 (GooglePlayDeveloperApiClient 참고)
    implementation 'com.google.apis:google-api-services-androidpublisher:v3-rev20250602-2.0.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.35.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    // `-Dspring.*` 를 테스트 JVM 으로 넘긴다 — 데이터소스를 갈아끼워 돌리기 위한 통로다.
    // 기본은 H2 지만 운영은 PostgreSQL 이고, 둘은 SQL 해석이 달라
    // H2 에서 통과한 쿼리가 운영에서만 500 을 내는 일이 실제로 있었다(피드 타임라인).
    // 실행법은 docs/RUNNING.md 참고.
    systemProperties System.getProperties().findAll { k, v -> k.toString().startsWith('spring.') }
}

// Spring Boot 실행형 jar 만 생성 (plain jar 비활성화 → 산출물 단일화)
tasks.named('jar') {
    enabled = false
}
