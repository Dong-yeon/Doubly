# 테스트 프로파일 — 외부 인프라(Postgres/Redis) 없이 컨텍스트 로드 검증
spring:
  datasource:
    url: jdbc:h2:mem:fitto;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 스키마는 Flyway 가 만든다. validate 로 엔티티↔스키마 불일치까지 잡는다.
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    # 운영과 동일한 마이그레이션을 테스트에서도 적용한다.
    #
    # 이전에는 flyway 를 끄고 ddl-auto: create-drop 을 썼는데, 엔티티가 @ManyToOne 대신
    # 평범한 Long 컬럼을 쓰는 구조라 Hibernate 가 FK 를 만들지 않았다. 그 결과 테스트
    # 스키마에는 외래키가 하나도 없었고, 운영(Postgres)에서만 터지는 FK 위반을
    # 테스트가 원천적으로 잡을 수 없었다 — 실제로 회원 탈퇴가 그렇게 깨져 있었다.
    enabled: true
  data:
    redis:
      repositories:
        enabled: false

# Redis 자동연결 비활성화를 위해 lettuce는 lazy — 테스트에서 미사용
fitto:
  jwt:
    secret: test-secret-test-secret-test-secret-32b
    access-token-expire-minutes: 30
    refresh-token-expire-days: 14
  # Stream 토큰 서명은 로컬 HS256 서명뿐(네트워크 호출 없음) — 더미 값으로 통화 플로우 전체를 검증한다
  stream:
    api-key: test-stream-key
    api-secret: test-stream-secret-test-stream-secret-32b
