spring:
  application:
    name: fitto

  # PostgreSQL (설계서 6.1) — 환경변수로 주입, 기본값은 로컬 개발
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fitto}
    username: ${DB_USERNAME:fitto}
    password: ${DB_PASSWORD:fitto}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    deserialization:
      fail-on-unknown-properties: false   # 클라이언트의 부가 필드는 무시
    default-property-inclusion: non_null

  # Flyway 마이그레이션 (DB 구성)
  flyway:
    enabled: true
    baseline-on-migrate: true

  # @Scheduled 전용 스레드풀 — 기본값 1개론 CallSessionSweeper(5초 주기 상시 점유)와
  # 나머지 cron 스케줄러(캘린더·추억·스트릭 위기·질문 리마인드·혼자가입자 프리뷰)가
  # 같은 시각에 겹칠 때 서로 밀린다. 스케줄러 6개 이상으로 늘어난 시점에 넉넉히 잡아둔다.
  task:
    scheduling:
      pool:
        size: 4

  # Redis — AI(Gemini) 사용자별 일일 사용량 카운터 (미가용 시 인메모리 폴백).
  # 로컬은 host/port 사용. 클라우드(Railway 등)는 SPRING_DATA_REDIS_URL 환경변수
  # (redis://default:password@host:port)로 덮어쓰면 인증까지 자동 처리된다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis는 StringRedisTemplate으로만 쓰고(@RedisHash 엔티티 없음) 리포지토리 계층이 없다.
      # 꺼두지 않으면 JPA 리포지토리 37개와 같은 베이스 패키지를 스캔하면서
      # "Could not safely identify store assignment" 경고가 기동 로그마다 반복 출력된다.
      repositories:
        enabled: false

  # 비밀번호 재설정 인증코드 메일(AUTH-07).
  # MAIL_HOST 가 비어 있으면 JavaMailSender 빈이 생성되지 않고, 코드가 서버 로그로 출력된다
  # (개발 전용 폴백 — LoggingPasswordResetMailSender). 운영에서는 반드시 설정할 것.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # 연결/응답 타임아웃(ms). 없으면 JavaMail 기본값이 무한(-1)이라,
          # SMTP 서버에 닿지 못하면 발송이 요청 스레드에서 영영 멈춘다.
          # 5초 안에 실패시키고, 발송 실패는 삼켜 로깅한다(SmtpPasswordResetMailSender).
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true

server:
  # 클라우드(Railway 등)는 PORT 환경변수로 리스닝 포트를 주입한다.
  port: ${PORT:8080}

# 애플리케이션 커스텀 설정
fitto:
  # CORS 허용 출처 — 개발 기본값은 전체 허용. 운영은 application-prod.yml 이
  # CORS_ALLOWED_ORIGINS 환경변수(쉼표 구분 도메인)로 화이트리스트를 강제한다.
  cors:
    allowed-origins: "*"

  jwt:
    # 운영에서는 반드시 JWT_SECRET 환경변수로 주입. 미설정 시 dev 전용 값(운영 프로파일에서 부팅 차단).
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    access-token-expire-minutes: 30
    refresh-token-expire-days: 14

  # 비밀번호 재설정 메일 — Resend(HTTP). RESEND_API_KEY 가 있으면 SMTP 보다 우선 사용.
  # (env 이름과 프로퍼티 이름이 다르므로 여기서 명시적으로 배선해야 바인딩된다)
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:Doubly <onboarding@resend.dev>}

  # Cloudinary 서명 업로드 — 미설정 시 프론트가 unsigned preset 으로 폴백
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:fitto}

  # 구글 로그인 — 허용할 OAuth 클라이언트 id 목록(쉼표 구분: 웹/안드로이드).
  # 미설정 시 기능만 비활성(SOCIAL_LOGIN_NOT_CONFIGURED), 이메일 로그인은 그대로 동작.
  google-auth:
    client-ids: ${GOOGLE_CLIENT_IDS:}

  # 요금제 — FREE / PRO
  plan:
    # true 면 전원 PRO 로 판정된다(출시 초기 무료 체험).
    #
    # 한도 숫자는 실사용 분포를 재기 전에는 근거가 없어서, 제한을 켜는 대신 "판정 경로"만
    # 먼저 깔아두는 상태다. 결제를 붙이고 한도를 확정한 뒤 PLAN_FREE_TRIAL=false 로 끈다.
    # 이 플래그가 켜져 있는 동안 PlanResolver 는 DB 조회 없이 즉시 PRO 를 돌려주므로
    # 성능 부담도 없다.
    free-trial: ${PLAN_FREE_TRIAL:true}

  # Google Play 구독 웹훅(RTDN) — 서비스 계정 키(base64) 미설정 시 기능 전체 비활성,
  # 웹훅 요청은 전부 403(GooglePlayProperties 참고). 패키지명·서비스 계정 키는 스토어
  # 등록/심사 이후에나 발급되므로 그 전까지는 비어 있는 게 정상이다.
  google-play:
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME:}
    service-account-json-base64: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64:}
    webhook-token: ${GOOGLE_PLAY_WEBHOOK_TOKEN:}

  # 음식 사진 AI 분석 (Google AI Studio 무료 티어) — 키 미설정 시 기능만 비활성, 앱은 정상 동작
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    daily-limit-per-user: ${GEMINI_DAILY_LIMIT_PER_USER:10}

  # 바코드 식품 DB 조회 (식품안전나라 OpenAPI, 무료) — 키 미설정 시 바코드 조회만 비활성
  food-db:
    api-key: ${FOOD_DB_API_KEY:}
    base-url: ${FOOD_DB_BASE_URL:http://openapi.foodsafetykorea.go.kr/api}

  # 카카오 로컬 REST API (AI 맛집 추천의 실존 장소 검색) — 프론트 지도용 JS 키와 별개.
  # 카카오 개발자 콘솔의 같은 앱에서 "REST API 키"를 복사한다. 미설정 시 맛집 추천만 비활성.
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}

  # 통화·영상통화 (Stream Video, PLAN.md "통화·영상통화") — 키 미설정 시 통화 기능만 비활성
  stream:
    api-key: ${STREAM_API_KEY:}
    api-secret: ${STREAM_API_SECRET:}
    expire-minutes: ${STREAM_TOKEN_EXPIRE_MINUTES:60}

logging:
  level:
    com.fitto: DEBUG
