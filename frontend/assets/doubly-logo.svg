<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Doubly 아이콘 마스터: 초록 그라데이션 배경 위에 두 하트 아웃라인이 겹치고, 위에 반짝임
       세 개. 뒤(연한 민트, #D7F0D6) = 상대, 앞(짙은 포레스트, #0F3D16) = 나. 배경은
       #4E9E56(좌상단) → #143D19(우하단) 대각 그라데이션. 좌표는
       frontend/src/components/DoublyLogo.tsx 의 heartPoints(BACK_SCALE/CX/CY),
       heartPoints(FRONT_SCALE/CX/CY) 를 1024 캔버스에 맞춰 스케일한 값이다 — 마크를 바꿀 땐
       그 파일을 고치고 이 SVG를 다시 뽑아야 한다. 인앱 DoublyMark는 같은 두 하트를 배경 없이
       쓰고, 라이트/다크 배경에 맞춰 색만 바꾼다. -->
